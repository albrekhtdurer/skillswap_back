version: "3"

services:

  back:
    image: skill-swap-back:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skill-swap-back
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    ports:
      - 8000:8000
    env_file:
    - ./.env
    volumes:
      - /opt/uploaded_files:/opt/uploaded_files
      - ./skillswap.db:/opt/skillswap_back/skillswap.db
